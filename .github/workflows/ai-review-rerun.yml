name: AI Review Rerun

on:
  workflow_run:
    workflows: [AI Review]
    types: [completed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: write
  contents: read
  pull-requests: read

# Serialize wakeups so two receipt/summary events cannot requeue the same run.
concurrency:
  group: ai-review-rerun-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  ai-review-rerun:
    name: ai-review-rerun
    if: |
      github.event_name == 'workflow_run' ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.type == 'Bot'
      ) ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.type == 'Bot' &&
        (
          startsWith(github.event.comment.body, 'Codex Review:') ||
          contains(github.event.comment.body, '<!-- codex-review-receipt:') ||
          contains(github.event.comment.body, '<!-- codex-pull-request-review-summary') ||
          contains(github.event.comment.body, 'AI_REVIEW_OUTCOME:')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted rerun scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Rerun AI Review for trusted evidence
        run: node scripts/ai-review-rerun.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ vars.AI_REVIEW_AGENT }}
