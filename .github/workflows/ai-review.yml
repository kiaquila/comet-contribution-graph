name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: string
      trigger_mode:
        description: Must be skip; request native review through a human-authored comment
        required: false
        default: skip
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: >-
    ai-review-${{ github.event.pull_request.number ||
    inputs.pr_number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    # Gate-based path: codex and gemini only. Claude review is intentionally
    # non-operational in this repository until restored in a dedicated PR.
    name: AI Review
    if: |
      (
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.draft == false
      ) &&
      (
        vars.AI_REVIEW_AGENT == '' ||
        vars.AI_REVIEW_AGENT == 'codex' ||
        vars.AI_REVIEW_AGENT == 'gemini'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The sole rollout exception is an immutable version already reviewed by
      # the native connector, not a selectable PR ref. Provenance:
      # https://github.com/kiaquila/comet-contribution-graph/pull/55#issuecomment-6203485501
      # No write token, repository secrets, PR artifacts, or dependency install.
      - name: Checkout trusted gate scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 55 && github.repository == 'kiaquila/comet-contribution-graph' && '5773da6b5b93d5f91486b2c6d631e56faea4da44' || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Constrain the one-time receipt rollout
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 55 && github.repository == 'kiaquila/comet-contribution-graph'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROLLOUT_PR_NUMBER: ${{ github.event.pull_request.number }}
          ROLLOUT_WORKFLOW_SHA: ${{ github.event.pull_request.head.sha }}
          ROLLOUT_WORKFLOW_REF: ${{ github.head_ref }}
          SELECTED_AGENT: ${{ vars.AI_REVIEW_AGENT }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.GITHUB_REPOSITORY, 'kiaquila/comet-contribution-graph');
          assert.equal(process.env.ROLLOUT_PR_NUMBER, '55');
          assert.equal(process.env.ROLLOUT_WORKFLOW_REF, 'codex/native-review-receipts');
          assert.equal(process.env.SELECTED_AGENT || 'codex', 'codex');
          const response = await fetch('https://api.github.com/repos/kiaquila/comet-contribution-graph/pulls/55', {
            headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: 'application/vnd.github+json' },
          });
          assert.equal(response.ok, true, `Unable to read rollout PR: ${response.status}`);
          const pull = await response.json();
          assert.equal(pull.state, 'open');
          assert.equal(pull.draft, false);
          assert.equal(pull.head.repo.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(pull.base.repo.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(pull.base.ref, 'main');
          assert.equal(pull.head.sha, process.env.ROLLOUT_WORKFLOW_SHA, 'Run must validate the live PR head');
          NODE

      - name: Resolve PR context
        id: pr
        run: node scripts/resolve-pr-context.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_PR_NUMBER: ${{ inputs.pr_number }}

      - name: Resolve selected review policy
        id: policy
        shell: bash
        env:
          SELECTED_AGENT: ${{ vars.AI_REVIEW_AGENT }}
          REQUESTED_TRIGGER_MODE: ${{ inputs.trigger_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          selected="${SELECTED_AGENT:-codex}"
          selected="${selected:-codex}"
          case "$selected" in
            codex|gemini) ;;
            *)
              echo "::error::Unsupported AI_REVIEW_AGENT value: '$selected'. Allowed: codex, gemini."
              exit 1
              ;;
          esac
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            trigger_mode="${REQUESTED_TRIGGER_MODE:-skip}"
          else
            trigger_mode="skip"
          fi
          case "$trigger_mode" in
            skip) ;;
            *)
              echo "::error::The read-only gate requires trigger_mode=skip. Request native review through a human-authored comment."
              exit 1
              ;;
          esac
          echo "selected_agent=$selected" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$trigger_mode" >> "$GITHUB_OUTPUT"

      - name: Route and validate selected native review
        run: node scripts/ai-review-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ steps.policy.outputs.selected_agent }}
          AI_REVIEW_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          AI_REVIEW_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          AI_REVIEW_TRIGGER_MODE: ${{ steps.policy.outputs.trigger_mode }}
          AI_REVIEW_WAIT_MS: "30000"
          AI_REVIEW_POLL_MS: "5000"
          AI_REVIEW_MAX_POLL_MS: "10000"
          AI_REVIEW_DEBOUNCE_MS: "5000"
